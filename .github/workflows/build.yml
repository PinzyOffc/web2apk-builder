name: Build Sync XxX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP untuk download'
        required: false
        type: string
      tag:
        description: 'Tag versi'
        required: false
        type: string
      build_type:
        description: 'Tipe build (debug/release)'
        required: false
        type: string
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Gradle Files (if missing)
        run: |
          if [ ! -f "android/settings.gradle" ]; then
            echo "⚠️ Gradle files missing, restoring from template..."
            mkdir -p android/gradle/wrapper
            
            cat > android/settings.gradle << 'EOF'
          rootProject.name = "SyncXxX"
          include ':app'
          EOF

            cat > android/build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

            cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m
          android.useAndroidX=true
          EOF

            cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          #Mon Jun 19 12:00:00 GMT 2026
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7.0-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

            echo "✅ Gradle files restored"
          else
            echo "✅ Gradle files already present"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate App Icons
        run: |
          cat > generate_icons.py << 'EOF'
          import os
          try:
              from PIL import Image, ImageDraw
          except ImportError:
              os.system("pip install Pillow")
              from PIL import Image, ImageDraw

          ICON_SIZES = {
              "mdpi":    48,
              "hdpi":    72,
              "xhdpi":   96,
              "xxhdpi":  144,
              "xxxhdpi": 192
          }

          THEMES = {
              "ic_theme_whatsapp":  "whatsapp.jpg",
              "ic_theme_youtube":   "youtube.jpg",
              "ic_theme_instagram": "instagram.jpg",
              "ic_theme_telegram":  "telegram.jpg",
              "ic_theme_xnxx":      "xnxx.jpg",
          }

          def load_img(path):
              img = Image.open(path)
              if img.mode == "RGBA":
                  bg = Image.new("RGB", img.size, (0, 0, 0))
                  bg.paste(img, mask=img.split()[3])
                  return bg
              elif img.mode != "RGB":
                  return img.convert("RGB")
              return img

          def make_placeholder(size):
              icon = Image.new("RGB", (size, size), (8, 12, 16))
              draw = ImageDraw.Draw(icon)
              draw.ellipse([size//4, size//4, 3*size//4, 3*size//4], fill=(0, 212, 255))
              return icon

          use_icon = os.path.isfile("sync.jpg")
          img_base = load_img("sync.jpg") if use_icon else None

          for density, size in ICON_SIZES.items():
              out_dir = "android/app/src/main/res/mipmap-" + density
              os.makedirs(out_dir, exist_ok=True)

              icon = img_base.resize((size, size), Image.LANCZOS) if use_icon else make_placeholder(size)
              icon.save(os.path.join(out_dir, "ic_launcher.png"), "PNG")
              icon.save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG")

              for name, src_file in THEMES.items():
                  if os.path.isfile(src_file):
                      theme_img = load_img(src_file).resize((size, size), Image.LANCZOS)
                  else:
                      theme_img = make_placeholder(size)

                  theme_img.save(os.path.join(out_dir, f"{name}.png"), "PNG")

          print("✅ Icons generated")
          EOF

          python3 generate_icons.py

      - name: Setup Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.7.0 2>/dev/null || true
          chmod +x gradlew
          echo "✅ Gradle wrapper ready"

      - name: Download ZIP (if provided)
        if: ${{ github.event.inputs.zip_url != '' }}
        run: |
          curl -L -o source.zip "${{ github.event.inputs.zip_url }}"
          unzip -o source.zip -d ./
          echo "✅ ZIP downloaded and extracted"

      - name: Show build info
        run: |
          echo "📦 Build Type: ${{ github.event.inputs.build_type || 'release' }}"
          echo "🏷️ Tag: ${{ github.event.inputs.tag || 'latest' }}"
          echo "🔨 Building Sync XxX APK..."

      - name: Build APK
        run: |
          cd android
          ./gradlew assemble${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }} \
            --no-daemon

      - name: Find and Copy APK
        run: |
          mkdir -p output
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          
          if [ "$BUILD_TYPE" = "debug" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f 2>/dev/null | head -1)
            [ -n "$APK_PATH" ] && cp "$APK_PATH" output/SyncXxX-debug.apk && echo "✅ Debug APK copied"
          else
            APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" -type f 2>/dev/null | head -1)
            [ -n "$APK_PATH" ] && cp "$APK_PATH" output/SyncXxX-release.apk && echo "✅ Release APK copied"
          fi

      - name: Create Version Info
        run: |
          mkdir -p output
          cat > output/version.txt << EOF
          Version: ${{ github.event.inputs.tag || 'latest' }}
          Build Date: $(date)
          Build Type: ${{ github.event.inputs.build_type || 'release' }}
          Commit: ${GITHUB_SHA:0:7}
          EOF

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncXxX-APK-${{ github.event.inputs.tag || 'latest' }}
          path: output/
          retention-days: 30
