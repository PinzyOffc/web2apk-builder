name: Build Sync XxX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP untuk download'
        required: false
        type: string
      tag:
        description: 'Tag versi'
        required: false
        type: string
      build_type:
        description: 'Tipe build (debug/release)'
        required: false
        type: string
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      # ==========================================================
      # Step Generate App Icons dengan script yang di-embed
      # ==========================================================
      - name: Generate App Icons
        run: |
          cat > generate_icons.py << 'EOF'
          import os

          try:
              from PIL import Image, ImageDraw
          except ImportError:
              os.system("pip install Pillow")
              from PIL import Image, ImageDraw

          ICON_SIZES = {
              "mdpi":    48,
              "hdpi":    72,
              "xhdpi":   96,
              "xxhdpi":  144,
              "xxxhdpi": 192
          }

          THEMES = {
              "ic_theme_whatsapp":  "whatsapp.jpg",
              "ic_theme_youtube":   "youtube.jpg",
              "ic_theme_instagram": "instagram.jpg",
              "ic_theme_telegram":  "telegram.jpg",
              "ic_theme_xnxx":      "xnxx.jpg",
          }

          def load_img(path):
              img = Image.open(path)
              if img.mode == "RGBA":
                  bg = Image.new("RGB", img.size, (0, 0, 0))
                  bg.paste(img, mask=img.split()[3])
                  return bg
              elif img.mode != "RGB":
                  return img.convert("RGB")
              return img

          def make_placeholder(size):
              icon = Image.new("RGB", (size, size), (8, 12, 16))
              draw = ImageDraw.Draw(icon)
              draw.ellipse([size//4, size//4, 3*size//4, 3*size//4], fill=(0, 212, 255))
              return icon

          # ── Default icon (sync.jpg) ──
          use_icon = os.path.isfile("sync.jpg")
          img_base = load_img("sync.jpg") if use_icon else None

          for density, size in ICON_SIZES.items():
              out_dir = "android/app/src/main/res/mipmap-" + density
              os.makedirs(out_dir, exist_ok=True)

              icon = img_base.resize((size, size), Image.LANCZOS) if use_icon else make_placeholder(size)
              icon.save(os.path.join(out_dir, "ic_launcher.png"), "PNG")
              icon.save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG")
              print(f"Default {density}: {size}x{size}")

              # ── Theme icons ──
              for name, src_file in THEMES.items():
                  if os.path.isfile(src_file):
                      theme_img = load_img(src_file).resize((size, size), Image.LANCZOS)
                  else:
                      print(f"  WARNING: {src_file} tidak ditemukan, pakai placeholder untuk {name}")
                      theme_img = make_placeholder(size)

                  theme_img.save(os.path.join(out_dir, f"{name}.png"), "PNG")
                  print(f"  Theme {name} {density}: {size}x{size}")

          print("Icons done")
          EOF

          python3 generate_icons.py

- name: Setup Gradle Wrapper
  run: |
    cd android
    gradle wrapper --gradle-version 8.4
    chmod +x gradlew

      - name: Download ZIP (if provided)
        if: ${{ github.event.inputs.zip_url != '' }}
        run: |
          curl -L -o source.zip "${{ github.event.inputs.zip_url }}"
          unzip -o source.zip -d ./
          echo "✅ ZIP downloaded and extracted"

      - name: Show build info
        run: |
          echo "📦 Build Type: ${{ github.event.inputs.build_type || 'release' }}"
          echo "🏷️ Tag: ${{ github.event.inputs.tag || 'latest' }}"
          echo "🔨 Building Sync XxX APK..."

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assemble${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }} --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            find android/app/build/outputs/apk/debug/ -name "*.apk" | head -1 | xargs -I{} cp {} output/SyncXxX-debug.apk
          else
            find android/app/build/outputs/apk/release/ -name "*.apk" | head -1 | xargs -I{} cp {} output/SyncXxX-release.apk
          fi

      - name: Create version info
        run: |
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          echo "Version: $TAG" > output/version.txt
          echo "Build Date: $(date)" >> output/version.txt
          echo "Build Type: ${{ github.event.inputs.build_type || 'release' }}" >> output/version.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncXxX-APK-${{ github.event.inputs.tag || 'latest' }}
          path: output/
          retention-days: 30

      - name: Create Release
  id: create_release
  if: ${{ github.event.inputs.tag != '' }}
  uses: actions/create-release@v1
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  with:
    tag_name: ${{ github.event.inputs.tag }}
    release_name: Release ${{ github.event.inputs.tag }}
    draft: false
    prerelease: false

- name: Upload APK to Release
  if: ${{ github.event.inputs.tag != '' }}
  uses: actions/upload-release-asset@v1
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  with:
    upload_url: ${{ steps.create_release.outputs.upload_url }}
    asset_path: output/SyncXxX-${{ github.event.inputs.build_type || 'release' }}.apk
    asset_name: SyncXxX-${{ github.event.inputs.tag }}.apk
    asset_content_type: application/vnd.android.package-archive
